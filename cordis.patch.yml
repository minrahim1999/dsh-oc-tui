# dsh-oc-tui bundle patch: the terminal UI over the dsh-base layer.
# Rows reference this package by name, so the package must be resolvable from
# the profile — the official path is `dsh plugin --profile tui add
# dsh-oc-tui`, which installs it into the profile's node_modules and
# appends this bundle. The zero-install development bootstrap may instead
# restate these rows in the profile's own patch with absolute module paths.

- insert:
    - id: tui-startup
      name: 'dsh-oc-tui/startup'

    - id: tui-app
      name: 'dsh-oc-tui'
      config:
        sidebar: true
        showReasoning: true

# Agent modes. This build targets dsh 0.2.2, whose agent plane lives behind
# presets: `package.json` `dsh.bundle.patch` lists presets/*.patch.yml after
# this file. Those layers are the Web UI's own declarations, copied from
# `@deepseek-ai/dsh-web-app` by scripts/sync-presets.mjs: they disable the
# base's process-wide agent rows, mount `@deepseek-ai/dsh-agent-preset-registry`,
# and declare the Standard, PTC, Minimal and Creator (`cordis`) presets. Every
# TUI session is then bound to one preset at creation (lib/agent-presets.js),
# `/mode` switches it, and Settings -> Default preset writes the registry's
# `selectedDefault`, the same field the Web UI edits.
#
# The model-facing `ask_user_question` tool is a preset row now: Standard, PTC
# and Creator mount `@deepseek-ai/dsh-tool-ask-user` themselves (Minimal
# deliberately omits it), so this bundle no longer declares a process-wide
# copy. lib/index.js still answers the `user-questions/request` waterfall with
# a modal.
